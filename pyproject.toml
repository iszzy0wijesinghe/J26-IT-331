[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


# ============================================================
# GeoNex — Python Project Configuration
# ============================================================

[project]
name = "geonex"
version = "0.1.0"
description = "GeoNex smart landslide early warning research platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
]


# ============================================================
# Development Dependencies
# ============================================================

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.7,<1",
]


# ============================================================
# Python Package Configuration
#
# GeoNex uses a modular monorepo architecture.
#
# Explicit package registration ensures that all required
# Python packages are included in editable installations.
#
# Main runtime packages:
#
# apps/        -> Application services
# components/  -> Research components C1, C2, C3, C4
# shared/      -> Contracts, configurations and utilities
# database/    -> Database foundation and persistence
#
# Non-Python resources such as datasets, model artifacts,
# documentation, firmware and experiments are not included
# as importable application packages.
#
# IMPORTANT:
# When adding a new Python subpackage, register it below.
# ============================================================

[tool.setuptools]

include-package-data = false

packages = [

    # --------------------------------------------------------
    # Application Services
    # --------------------------------------------------------

    "apps",
    "apps.api",
    "apps.decision_engine",
    "apps.ingestion",
    "apps.runtime_orchestrator",


    # --------------------------------------------------------
    # Research Components
    # --------------------------------------------------------

    "components",
    "components.c1_credibility",
    "components.c2_diagnostics",
    "components.c3_forecasting",
    "components.c4_trust",


    # --------------------------------------------------------
    # Shared Infrastructure
    # --------------------------------------------------------

    "shared",
    "shared.config",
    "shared.contracts",
    "shared.enums",
    "shared.features",
    "shared.logging",
    "shared.schemas",
    "shared.telemetry",
    "shared.time",
    "shared.utils",
    "shared.simulation",


    # --------------------------------------------------------
    # Database Infrastructure
    # --------------------------------------------------------

    "database",

]


# ============================================================
# Pytest Configuration
# ============================================================

[tool.pytest.ini_options]

testpaths = ["tests"]

pythonpath = ["."]

addopts = "-ra"


# ============================================================
# Ruff Configuration
# ============================================================

[tool.ruff]

line-length = 100

target-version = "py312"


# ============================================================
# Ruff Lint Rules
# ============================================================

[tool.ruff.lint]

select = [
    "E",   # Pycodestyle errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "UP",  # Python modernization
    "B",   # Bugbear
]